# Base application URL
base.url=https://uat.routeye.com

# Browser: chrome | firefox | edge
browser=chrome

# Run headless (true/false) - useful for CI
headless=true

# Timeouts (seconds)
implicit.wait=5
explicit.wait=15
pageload.timeout=30

# Reporting
report.path=test-output/ExtentReport.html

# Screenshots on failure
screenshot.path=test-output/screenshots/

# ---- Test login credentials ----
# Don't commit real credentials here. Override at run time instead, e.g.:
#   mvn test -Dtest.username=tanuradha -Dtest.password=Tanu@12345
# or set them as CI secrets / environment variables read via ConfigReader.
test.username=tanuradha
test.password=Tanu@12345

# ---- Trip creation test data ----
trip.name=Test Template
trip.origin.search=imz corporate
trip.origin.match=IMZ Corporate
trip.destination.search=Chattarpur
trip.destination.match=Chattarpur Metro
trip.device.search=902
trip.device.match=675080220902
trip.contact.primary=9695883037
trip.contact.secondary=9695883037
trip.overspeed.kmh=60
trip.sms.number=9695883037
trip.receipt.no=123

# ---- Client creation test data ----
client.name=Automation Test Client
client.contact.name=Automation QA
client.contact.no=9876543210
client.state=Delhi
client.city=New Delhi
client.status=Active

# ---- Account creation test data ----
account.name=Automation Test Account
account.contact.name=Automation QA
account.contact.no=9876543210
account.state=Delhi
account.city=New Delhi
account.validity.start=2026-07-27T10:00
account.validity.end=2027-07-27T10:00

# ---- Role creation test data ----
role.template=Superadmin
role.display.name=Automation Test Role

# ---- User creation test data ----
# client.name, account.name, role.template above are reused here - the
# user must be created under a client/account/role that already exist.
user.account.type=Account
user.username=automation.test.user
user.first.name=Automation
user.last.name=User
user.contact.no=9876543211
user.password=Automation@123
